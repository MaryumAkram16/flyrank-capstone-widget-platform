run: uvicorn app.main:app --reload
seed: python -m app.seed
test: pytest -q
base_url: http://localhost:8000
endpoints:
  - POST /api/widgets
  - GET /api/widgets
  - GET /widgets/{id}/config
  - GET /widgets/{id}/challenge
  - GET /widget/{version}.js
  - POST /submissions
  - GET /api/dashboard/widgets/{id}/stats
  - GET /api/dashboard/widgets/{id}/view
  - GET /api/dashboard/widgets/{id}/stream
  - POST /demo/geo-provider-a/{state}
  - POST /demo/geo-provider-b/{state}
  - POST /demo/email-side-effect/{state}
  - POST /demo/reset
